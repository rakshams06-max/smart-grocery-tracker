<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Grocery Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <header>
            <p class="eyebrow">Monthly spending</p>
            <h1>Smart Grocery Tracker</h1>
            <p class="intro">Keep your shopping list and grocery budget in one place.</p>
        </header>

        <section class="budget-section" aria-labelledby="budget-heading">
            <label id="budget-heading" for="budget">Monthly budget</label>
            <input type="number" id="budget" placeholder="Enter monthly budget" min="0" step="0.01">
            <p id="budgetMessage" class="budget-message" role="status"></p>
        </section>

        <form id="itemForm" class="input-section">
            <label class="sr-only" for="itemName">Grocery item</label>
            <input type="text" id="itemName" placeholder="Grocery item" required>
            <label class="sr-only" for="itemPrice">Price</label>
            <input type="number" id="itemPrice" placeholder="Price" min="0.01" step="0.01" required>
            <button type="submit">Add item</button>
        </form>

        <section class="list-section" aria-labelledby="list-heading">
            <div class="section-heading">
                <h2 id="list-heading">Shopping list</h2>
                <span id="itemCount">0 items</span>
            </div>
            <ul id="groceryList"></ul>
            <p id="emptyMessage" class="empty-message">Your shopping list is empty.</p>
        </section>

        <section class="dashboard" aria-labelledby="total-heading">
            <div>
                <h2 id="total-heading">Total spent</h2>
                <p class="total"><span aria-hidden="true">₹</span><span id="totalExpense">0.00</span></p>
            </div>
            <div id="overBudgetSummary" class="over-budget-summary" hidden>
                <h2>Over budget</h2>
                <p class="total over-budget-total"><span aria-hidden="true">₹</span><span id="overBudgetAmount">0.00</span></p>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
